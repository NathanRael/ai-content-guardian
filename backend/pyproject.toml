[project]
name = "hate-speech-detector"
version = "0.1.0"
description = "Détecteur de discours haineux avec audit de biais dialectal (AAE vs anglais standard)"
readme = "README.md"
authors = [
    { name = "NathanRael", email = "ralaivoavy.natanael@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deep-translator>=1.11.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib",
    "langchain>=1.3.18",
    "langchain-groq>=1.1.3",
    "langdetect",
    "lime",
    "matplotlib",
    "openpyxl",
    "pandas",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn",
    "seaborn",
    "shap",
    "streamlit",
    "tabulate>=0.10.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
hate-speech-detector = "hate_speech_detector:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
